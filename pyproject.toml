[project]
name = "mlbb-meta-analyser"
version = "1.0.0"
description = "Official Mobile Legends: Bang Bang Meta & Rank Data Analyser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
